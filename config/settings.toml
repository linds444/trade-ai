[market]
exchange = "coinbase"
symbols = ["BTC-USD", "ETH-USD"]
candle_minutes = 5
prediction_horizon_minutes = 30

[targets]
# Provisional label boundary: +/-0.1% is flat. This is not a trading threshold.
flat_return_threshold = 0.001

[features]
momentum_steps = 6
rolling_window = 12

[split]
train_fraction = 0.6
validation_fraction = 0.2
# Remaining 0.2 is held out for testing; overlapping labels are purged.

[baseline]
random_seed = 42
logistic_c = 1.0
logistic_max_iter = 1000
naive_smoothing = 1.0
calibration_bins = 10

[boosting]
# Fixed starting model; validation/test labels are never used for fitting.
n_estimators = 200
max_depth = 3
learning_rate = 0.05
min_child_weight = 5.0
reg_lambda = 5.0
n_jobs = 4

[mlp]
hidden_sizes = [64, 32]
dropout = 0.1
epochs = 30
batch_size = 256
learning_rate = 0.001
weight_decay = 0.001
grad_clip_norm = 1.0
# GPU training is explicit; a missing CUDA environment stops the run.
device = "cuda"
mixed_precision = true
cpu_threads = 4

[calibration]
# Earlier validation rows fit temperature; later rows assess it after purging.
fit_fraction = 0.5
min_temperature = 0.25
max_temperature = 4.0
probability_floor = 1e-12
optimizer_tolerance = 1e-6
max_iterations = 200

[download]
lookback_days = 7
timeout_seconds = 30
max_attempts = 3
request_pause_seconds = 0.35

[paths]
raw = "data/raw"
processed = "data/processed"
models = "data/models"
