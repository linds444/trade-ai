name: Python tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CPU PyTorch
        run: python -m pip install "torch>=2.11,<2.12" --index-url https://download.pytorch.org/whl/cpu
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Exercise Windows without system long-path opt-in
        if: runner.os == 'Windows'
        run: Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name LongPathsEnabled -Value 0
      - name: Run tests including long Windows paths
        run: python -m pytest -q
